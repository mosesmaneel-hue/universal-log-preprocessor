<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<title>Chibi Wolf Mascot - ARC</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020617;
  }

  @keyframes floatBounce {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(0.4deg); }
  }

  @keyframes tailWag {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(18deg); }
  }

  @keyframes earTwitchLeft {
    0%, 82%, 100% { transform: rotate(0deg); }
    86% { transform: rotate(-7deg); }
    90% { transform: rotate(3deg); }
    94% { transform: rotate(-3deg); }
  }

  @keyframes earTwitchRight {
    0%, 65%, 100% { transform: rotate(0deg); }
    70% { transform: rotate(8deg); }
    74% { transform: rotate(-3deg); }
    78% { transform: rotate(5deg); }
  }

  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.08); }
    97% { transform: scaleY(1.1); }
  }

  @keyframes sparklePulse {
    0%, 100% { opacity: 0.2; transform: scale(0.6) rotate(0deg); }
    50% { opacity: 0.95; transform: scale(1.15) rotate(90deg); }
  }

  @keyframes ambientAura {
    0%, 100% { opacity: 0.55; transform: scale(0.96); }
    50% { opacity: 0.85; transform: scale(1.04); }
  }

  @keyframes collarGlow {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6)); }
    50% { filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.95)); }
  }

  .anim-body {
    transform-origin: 500px 750px;
    animation: floatBounce 3.8s ease-in-out infinite;
  }

  .anim-tail {
    transform-origin: 390px 650px;
    animation: tailWag 2.4s ease-in-out infinite;
  }

  .anim-ear-left {
    transform-origin: 370px 320px;
    animation: earTwitchLeft 4.5s ease-in-out infinite;
  }

  .anim-ear-right {
    transform-origin: 630px 320px;
    animation: earTwitchRight 5.2s ease-in-out infinite;
  }

  .anim-eye {
    transform-origin: 500px 455px;
    animation: blink 4.2s infinite;
  }

  .anim-sparkle-1 { animation: sparklePulse 2.8s ease-in-out infinite; transform-origin: 260px 320px; }
  .anim-sparkle-2 { animation: sparklePulse 3.3s ease-in-out 0.7s infinite; transform-origin: 750px 280px; }
  .anim-sparkle-3 { animation: sparklePulse 2.5s ease-in-out 1.2s infinite; transform-origin: 220px 580px; }
  .anim-sparkle-4 { animation: sparklePulse 3.1s ease-in-out 1.8s infinite; transform-origin: 770px 600px; }
  .anim-sparkle-5 { animation: sparklePulse 2.2s ease-in-out 0.4s infinite; transform-origin: 500px 170px; }
  .anim-aura { animation: ambientAura 4s ease-in-out infinite; transform-origin: 500px 520px; }
  .anim-pendant { animation: collarGlow 2.5s ease-in-out infinite; }
</style>
</head>
